<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b20">
<meta name="description" content="奶龙工程大学 · 互联网趣味页面，3 秒后前往哈尔滨工程大学官网">
<title>奶龙工程大学 · 正在前往</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f2c14a'/%3E%3Ccircle cx='50' cy='52' r='26' fill='%23ffd94a'/%3E%3Ccircle cx='41' cy='46' r='4' fill='%23fff'/%3E%3Ccircle cx='59' cy='46' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* ==========================================================
     奶龙工程大学 · 跳转页
     想换主色调：只改下面 :root 里的 --blue-* 几个变量即可
     ========================================================== */
  :root{
    --bg-0:#04081a;
    --bg-1:#071130;
    --bg-2:#0b1c46;
    --blue-1:#7fb4ff;
    --blue-2:#3d7dff;
    --blue-3:#9ed2ff;
    --blue-deep:#123a86;
    --text:#eaf2ff;
    --text-dim:#a9bbdd;
    --text-faint:#6e80a6;
    --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
    --delay:3s;               /* 与 JS 里的 CONFIG.delay 保持一致，供动画使用 */
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--text);
    background:
      radial-gradient(120% 62% at 50% 34%, rgba(61,125,255,.20) 0%, rgba(61,125,255,.07) 38%, rgba(4,8,26,0) 72%),
      radial-gradient(90% 45% at 50% 100%, rgba(30,80,190,.22) 0%, rgba(4,8,26,0) 70%),
      linear-gradient(180deg,var(--bg-1) 0%,var(--bg-0) 55%,#03060f 100%);
    background-attachment:fixed;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;            /* 光晕/粒子不允许把页面撑出横向滚动条 */
    padding:0 24px calc(28px + env(safe-area-inset-bottom));
    animation:fadeIn .7s ease both;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 背景飘浮粒子 ---------- */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .particles i{
    position:absolute;bottom:-8vh;border-radius:50%;
    background:radial-gradient(circle,#bcd8ff 0%,rgba(120,170,255,.25) 55%,rgba(120,170,255,0) 72%);
    animation:rise linear infinite;
    will-change:transform,opacity;
  }
  @keyframes rise{
    0%{transform:translate3d(0,0,0) scale(.6);opacity:0}
    12%{opacity:.9}
    80%{opacity:.5}
    100%{transform:translate3d(var(--dx,12px),-118vh,0) scale(1.15);opacity:0}
  }

  /* ---------- 顶部条 ---------- */
  .topbar{
    position:relative;z-index:2;
    width:100%;max-width:640px;
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;
    padding:calc(20px + env(safe-area-inset-top)) 2px 0;
    font-size:15px;
    letter-spacing:.16em;
    color:var(--blue-2);
    white-space:nowrap;
    animation:rise-in .9s cubic-bezier(.22,1,.36,1) both .05s;
  }
  .topbar .left{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:clamp(9.5px,2.55vw,14.5px);letter-spacing:.1em}
  .topbar .left::before{
    content:"";flex:none;width:8px;height:8px;border-radius:50%;
    background:var(--blue-2);box-shadow:0 0 12px var(--blue-2);
    animation:pulseDot 2.1s ease-in-out infinite;
  }
  .topbar .right{font-size:clamp(11px,3vw,15px);letter-spacing:.02em;color:var(--text-dim)}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}

  /* ---------- 主内容 ---------- */
  /* 竖向间距全部由 .stage 的 flex gap 控制，方便在矮屏上整体压缩；
     --g1 分组之间、--g2 组内（校训/倒计时）、--g3 进度条，--pad-t/--pad-b 上下内边距 */
  :root{
    --logo-size:clamp(150px,27vh,280px);
    --g1:clamp(5px,3.4vh,38px);
    --g2:clamp(3px,1.9vh,19px);
    --g3:clamp(3px,1.6vh,16px);
    --pad-t:clamp(8px,3.6vh,60px);
    --pad-b:clamp(8px,2.8vh,40px);
  }
  main{
    position:relative;z-index:1;
    width:100%;max-width:560px;
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:0;
  }
  .stage{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    gap:var(--g1);
    padding:var(--pad-t) 0 var(--pad-b);
  }
  .stage > *{margin:0}

  /* ---------- 校徽 ---------- */
  .logo-wrap{
    position:relative;
    width:min(62vw,var(--logo-size));aspect-ratio:1/1;
    display:grid;place-items:center;
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .18s;
  }
  .logo-wrap::before{           /* 旋转光带 */
    content:"";position:absolute;inset:-8%;
    border-radius:50%;
    background:conic-gradient(from 0deg,
      rgba(61,125,255,0) 0deg, rgba(126,180,255,.20) 40deg, rgba(150,200,255,.50) 80deg,
      rgba(126,180,255,.20) 125deg, rgba(61,125,255,0) 190deg, rgba(61,125,255,0) 360deg);
    filter:blur(16px);
    opacity:.8;
    animation:spin 9s linear infinite;
  }
  .logo-wrap::after{            /* 外层光斑 */
    content:"";position:absolute;inset:-18%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(61,125,255,.30) 0%, rgba(61,125,255,.09) 45%, rgba(61,125,255,0) 70%);
    filter:blur(6px);
    animation:glow 4.2s ease-in-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
  /* 圆形透明底校徽：不要圆角卡片和描边，用柔和投影融进深蓝背景 */
  .logo{
    position:relative;z-index:1;
    width:100%;height:100%;
    border-radius:0;
    display:block;
    object-fit:contain;
    background:transparent;
    box-shadow:none;
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(93,150,255,.35));
  }

  /* ---------- 校名 / 校训 ---------- */
  .en{
    font-size:13.5px;font-weight:500;
    letter-spacing:.24em;
    color:var(--blue-1);
    text-transform:uppercase;
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .34s;
  }
  .motto{
    margin-top:calc(var(--g2) - var(--g1));
    font-family:var(--serif);
    font-size:clamp(23px,6.2vw,30px);
    font-weight:700;
    letter-spacing:.16em;
    text-indent:.16em;
    background:linear-gradient(100deg,var(--blue-3) 0%,#ffffff 22%,var(--blue-2) 46%,#cfe4ff 62%,var(--blue-1) 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(61,125,255,.42));
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .44s, shimmer 6s linear infinite 1.4s;
  }
  @keyframes shimmer{from{background-position:0% 50%}to{background-position:260% 50%}}
  .motto-sub{
    margin-top:calc(var(--g2) - var(--g1));
    font-size:clamp(10.5px,2.9vw,12px);letter-spacing:.3em;color:var(--text-faint);
    text-transform:uppercase;
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .52s;
  }

  /* ---------- 大标题 ---------- */
  .headline{
    font-family:var(--serif);
    font-size:clamp(30px,3.1vw,46px);
    font-weight:700;
    letter-spacing:.06em;
    background:linear-gradient(100deg,#ffffff 0%,#d7e7ff 24%,var(--blue-2) 48%,#ffffff 68%,var(--blue-3) 100%);
    background-size:240% 100%;
    -webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(93,150,255,.5));
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .6s, shimmer 5.2s linear infinite 1.6s, breathe 3.2s ease-in-out infinite 1.6s;
  }
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}

  /* ---------- 三点指示 ---------- */
  .dots{display:flex;gap:11px;margin-top:calc(var(--g3) - var(--g1));align-items:center}
  .dots i{
    width:8px;height:8px;border-radius:50%;
    background:#2c3f6e;
    animation:dotWave 1.35s ease-in-out infinite;
  }
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes dotWave{
    0%,100%{background:#2c3f6e;transform:scale(.82);box-shadow:none}
    35%{background:var(--blue-3);transform:scale(1.18);box-shadow:0 0 14px rgba(158,210,255,.85)}
  }

  /* ---------- 倒计时 ---------- */
  .countdown{
    margin-top:calc(var(--g2) - var(--g1));
    font-size:clamp(13.5px,3.7vw,15px);letter-spacing:.1em;color:var(--text-dim);
  }
  .countdown b{
    font-family:var(--serif);
    font-size:clamp(17.5px,4.9vw,20px);font-weight:700;color:var(--blue-3);
    padding:0 3px;
    text-shadow:0 0 14px rgba(126,180,255,.8);
  }
  .bar{
    position:relative;
    width:min(74%,340px);height:3px;border-radius:99px;
    background:rgba(120,170,255,.16);
    margin-top:calc(var(--g3) - var(--g1));overflow:hidden;
  }
  .bar span{
    position:absolute;inset:0;border-radius:99px;
    background:linear-gradient(90deg,var(--blue-deep),var(--blue-2) 45%,var(--blue-3));
    box-shadow:0 0 14px rgba(93,150,255,.85);
    transform-origin:left center;
    animation:drain var(--delay) linear forwards;
  }
  @keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

  /* ---------- 立即前往按钮 ---------- */
  .cta{
    margin-top:0;
    display:inline-flex;align-items:center;gap:14px;
    padding:clamp(13px,1.6vh,16px) clamp(30px,8vw,44px);
    border-radius:999px;
    border:1px solid rgba(126,180,255,.42);
    background:linear-gradient(180deg, rgba(61,125,255,.16), rgba(61,125,255,.05));
    color:var(--blue-3);
    font-family:var(--serif);
    font-size:clamp(17.5px,4.9vw,20px);font-weight:700;letter-spacing:.14em;text-indent:.14em;
    text-decoration:none;
    box-shadow:0 10px 30px rgba(10,30,80,.5), inset 0 1px 0 rgba(255,255,255,.09);
    transition:transform .28s cubic-bezier(.22,1,.36,1), background .28s, border-color .28s, box-shadow .28s, color .28s;
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .72s, floaty 3.6s ease-in-out infinite 1.7s;
  }
  .cta svg{width:17px;height:17px;transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .cta:hover,.cta:focus-visible{
    background:linear-gradient(180deg, rgba(61,125,255,.32), rgba(61,125,255,.14));
    border-color:rgba(158,210,255,.85);
    color:#ffffff;
    transform:translateY(-3px);
    box-shadow:0 16px 40px rgba(40,90,200,.55), 0 0 0 4px rgba(61,125,255,.14);
    outline:none;
  }
  .cta:hover svg,.cta:focus-visible svg{transform:translate(3px,-3px)}
  .cta:active{transform:translateY(-1px) scale(.98)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* ---------- 页脚 ---------- */
  footer{
    position:relative;z-index:1;
    width:100%;max-width:520px;
    text-align:center;
    padding:clamp(16px,3vh,30px) 0 4px;
    border-top:1px solid rgba(120,170,255,.10);
    font-size:12.5px;letter-spacing:.08em;color:var(--text-faint);
    animation:rise-in 1s cubic-bezier(.22,1,.36,1) both .86s;
  }
  footer .sep{margin:0 8px;opacity:.55}

  /* ---------- 入场动画 ---------- */
  @keyframes rise-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  .no-anim .logo-wrap,.no-anim .en,.no-anim .motto,.no-anim .motto-sub,.no-anim .headline,
  .no-anim .cta,.no-anim footer,.no-anim .topbar{animation:none!important;opacity:1!important;transform:none!important}

  /* 竖向空间不够时分档压缩：先收间距，再收校徽，最后收字号。
     带鱼屏/大屏只在宽度上变宽，高度档位不会误伤。 */
  @media (max-width:374px){
    .en{font-size:12.5px;letter-spacing:.14em}
    .motto{font-size:22px;letter-spacing:.12em;text-indent:.12em}
    .headline{font-size:28px;letter-spacing:.04em}
  }
  @media (max-width:1000px){
    .topbar{max-width:560px}
    footer{max-width:560px}
  }
  /* 大屏把整列放大一点，避免 2K/4K 上中间显得空 */
  @media (min-width:1400px){
    :root{--logo-size:clamp(200px,29vh,304px)}
    main{max-width:660px}
    .topbar{max-width:660px}
    footer{max-width:660px}
  }
  @media (max-height:900px){
    :root{--g2:clamp(3px,1.5vh,14px); --g3:clamp(3px,1.3vh,12px)}
  }
  @media (max-height:820px){
    :root{
      --logo-size:min(52vw,188px);
      --g1:clamp(4px,2.2vh,18px);
      --g2:clamp(2px,1.1vh,10px);
      --g3:clamp(2px,0.9vh,8px);
      --pad-t:clamp(6px,2vh,18px);
      --pad-b:clamp(6px,1.8vh,16px);
    }
  }
  @media (max-height:690px){
    :root{--logo-size:min(42vw,160px); --pad-t:8px; --pad-b:8px}
    .motto-sub{display:none}
  }
  @media (max-height:560px){
    :root{--logo-size:min(30vw,124px); --g1:8px; --g2:4px}
    body{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
    .particles{display:none}
  }
</style>
</head>

<script>
/* ==========================================================================
   配置区：改这里就够了
   ========================================================================== */
const CONFIG = {
  target:      'https://www.hrbeu.edu.cn/',   // 3 秒后跳转的目标网址（哈尔滨工程大学官网）
  delay:       10000,                           // 停留时间，单位毫秒
  allowSkip:   true,                          // true = 点「立即前往」可提前跳转；false = 强制等满 3 秒
  headline:    '正在前往奶龙工程大学',
  motto:       '大奶至善，大龙至真',
  mottoSub:    '大奶至善 · 大龙至真',
  en:          'Nailong Engineering University',
  particles:   16,                             // 背景飘浮粒子数量，0 = 关闭

  /* 校徽：留空 = 用文件末尾内嵌的图；也可填 assets/logo.png 或 data:image/...;base64 */
  logo:        '',   // 留空 = 用 index.html 里已有的校徽；也可填图片地址覆盖
};

/* ========================== 以下逻辑一般不用改 ========================== */
(function () {
  const $ = (id) => document.getElementById(id);

  // 方便本地预览：index.html?delay=60 可把跳转延后到 60 秒（线上不带参数即按 CONFIG.delay 走）
  const qsDelay = new URLSearchParams(location.search).get('delay');
  if (qsDelay && /^\d+(\.\d+)?$/.test(qsDelay)) CONFIG.delay = parseFloat(qsDelay) * 1000;

  const delaySec = Math.max(1, Math.round(CONFIG.delay / 1000));

  // 文案
  $('headline').textContent = CONFIG.headline;
  $('motto').textContent    = CONFIG.motto;
  $('mottoSub').textContent = CONFIG.mottoSub;
  $('en').textContent       = CONFIG.en;
  if (CONFIG.logo) $('logo').src = CONFIG.logo;   // 留空则用 HTML 里的 src（可能是内嵌图）
  document.title            = CONFIG.headline + ' · 奶龙工程大学';

  // 进度条时长跟随配置
  document.documentElement.style.setProperty('--delay', delaySec + 's');

  // 背景粒子
  const box = $('particles');
  if (CONFIG.particles > 0 && box && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (let i = 0; i < CONFIG.particles; i++) {
      const p = document.createElement('i');
      const size = 2 + Math.random() * 4;
      p.style.width = p.style.height = size.toFixed(1) + 'px';
      p.style.left = (Math.random() * 100).toFixed(2) + '%';
      p.style.animationDuration = (9 + Math.random() * 11).toFixed(2) + 's';
      p.style.animationDelay = (-Math.random() * 18).toFixed(2) + 's';
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 120).toFixed(0) + 'px');
      p.style.opacity = (0.25 + Math.random() * 0.55).toFixed(2);
      box.appendChild(p);
    }
  }

  // 倒计时数字
  const secsEl = $('secs');
  let left = delaySec;
  secsEl.textContent = left;
  const tick = setInterval(() => {
    left -= 1;
    if (left >= 0) secsEl.textContent = left;
    if (left <= 0) clearInterval(tick);
  }, 1000);

  // 跳转
  const go = () => { window.location.replace(CONFIG.target); };
  $('cta').href = CONFIG.target;
  if (!CONFIG.allowSkip) {
    $('cta').addEventListener('click', (e) => e.preventDefault());
  }
  setTimeout(go, CONFIG.delay);
})();
</script>
